# Publish the curated team harness on each release tag.
# Cutting a release = pushing a vX.Y.Z tag from the source repo. This gate-checks,
# builds the curated bundle from scripts/dist.allowlist, and mirrors it to the
# separate team repo (viralpick/synapse-harness). Internal docs never ship.
#
# One-time setup (see docs/DISTRIBUTION.md):
#   1. Create the empty repo  viralpick/synapse-harness
#   2. Add repo secret  HARNESS_DEPLOY_TOKEN  = a PAT with write access to synapse-harness
name: Publish team harness

on:
  push:
    tags: ['v*.*.*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # The tag must be the TIP of the default branch. Twice now (v2.2.0 and v2.3.0) a tag
      # was cut, then work continued on main, so the published bundle carried a version
      # number whose release notes on main described things it did not contain — and because
      # the tag already existed, re-pushing it silently did nothing. A tag behind main means
      # the bundle is stale on arrival, so refuse rather than publish a lie.
      - name: Tag must be the tip of main
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          TAG_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$TAG_SHA" != "$MAIN_SHA" ]; then
            echo "TAG IS NOT THE TIP OF MAIN"
            echo "  tag ${GITHUB_REF_NAME} → ${TAG_SHA}"
            echo "  origin/main          → ${MAIN_SHA}"
            echo ""
            echo "Commits on main that this tag would NOT publish:"
            git log --oneline "${TAG_SHA}..${MAIN_SHA}" || true
            echo ""
            echo "Fix: push main first, then cut the tag on the tip. If the tag name is already"
            echo "taken by an earlier commit, do NOT force-move it — that makes one version mean"
            echo "two different bundles (the 1.0.2 defect). Cut the next version instead."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # The tag IS the version. Refuse to publish a tag whose source $version disagrees —
      # this is the check that would have caught two incompatible token sets both
      # claiming 1.0.2 (the space-scale rename shipped without a bump).
      - name: Tag must match source $version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SRC_VERSION="$(python3 -c "import json; print(json.load(open('tokens/synapse.tokens.json'))['\$version'])")"
          HDR_VERSION="$(grep -om1 'Version [0-9][0-9.]*' design.md | cut -d' ' -f2)"
          if [ "$TAG_VERSION" != "$SRC_VERSION" ] || [ "$TAG_VERSION" != "$HDR_VERSION" ]; then
            echo "VERSION MISMATCH: tag=v${TAG_VERSION} tokens.\$version=${SRC_VERSION} design.md=${HDR_VERSION}"
            echo "Bump the source version (tokens JSON + design.md header + preview.html, per design.md §6) before tagging."
            exit 1
          fi

      - name: Gate must be green before publishing
        run: python3 tools/validate.py all

      - name: Manifest must be current (regenerate == no diff)
        run: |
          python3 tools/build_manifest.py
          git diff --exit-code synapse.manifest.json || { echo "synapse.manifest.json is stale — run tools/build_manifest.py and commit before tagging."; exit 1; }

      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build curated bundle
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          SOURCE_DATE="$(date -u +%F)" node scripts/build-dist.mjs

      # AUTH: deploy key FIRST, token as fallback.
      #
      # A fine-grained PAT against an ORG-owned repo can require an org owner's approval,
      # which a plain org member cannot grant — so the token route is not self-serviceable
      # by this repo's maintainer. A DEPLOY KEY is: it is configured on the target repo by
      # anyone with repo admin, is not subject to org PAT policy, never expires, and is
      # scoped to exactly one repository (strictly tighter than any PAT).
      #
      # Setup, once — see docs/DISTRIBUTION.md:
      #   ssh-keygen -t ed25519 -f harness_deploy_key -N "" -C "synapse harness publish"
      #   PUBLIC  (harness_deploy_key.pub) -> viralpick/synapse-harness
      #        Settings -> Deploy keys -> Add deploy key -> TICK "Allow write access"
      #   PRIVATE (harness_deploy_key)     -> viralpick/synapse
      #        Settings -> Secrets and variables -> Actions -> New repository secret
      #        name: HARNESS_DEPLOY_KEY   (paste the whole file, BEGIN/END lines included)
      #   Then delete both local files.
      - name: Mirror ./dist to the team harness repo
        env:
          DEPLOY_KEY: ${{ secrets.HARNESS_DEPLOY_KEY }}
          DEPLOY_TOKEN: ${{ secrets.HARNESS_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [ -n "${DEPLOY_KEY:-}" ]; then
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/harness_key
            chmod 600 ~/.ssh/harness_key
            ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/harness_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
            REMOTE="git@github.com:viralpick/synapse-harness.git"
            echo "auth: deploy key"
          elif [ -n "${DEPLOY_TOKEN:-}" ]; then
            REMOTE="https://x-access-token:${DEPLOY_TOKEN}@github.com/viralpick/synapse-harness.git"
            echo "auth: PAT (HARNESS_DEPLOY_TOKEN) — no deploy key configured"
          else
            echo "NEITHER HARNESS_DEPLOY_KEY NOR HARNESS_DEPLOY_TOKEN IS SET."
            echo "Nothing can be published. See the setup comment above this step."
            exit 1
          fi
          git clone --depth 1 "$REMOTE" out
          find out -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R dist/. out/
          cd out
          git config user.name "synapse-bot"
          git config user.email "synapse-bot@users.noreply.github.com"
          git add -A
          git commit -m "release ${TAG}" || { echo "no changes to publish"; exit 0; }
          git push
          git tag "${TAG}"
          git push origin "${TAG}"
