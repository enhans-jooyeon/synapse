# Diagnose the harness publish path WITHOUT cutting a release.
#
# publish-harness.yml only fires on a `v*.*.*` tag, and a tag is immutable — so a
# misconfigured token or a disabled-Actions policy costs a whole version number to
# discover. This workflow does the same auth handshake, publishes NOTHING, and can be
# run from the Actions tab as many times as needed.
#
# Run it: Actions → "Check harness auth" → Run workflow.
# If it does not appear in the Actions list at all, Actions are disabled for this repo
# or blocked by the organization's Actions policy — that is itself the answer.
name: Check harness auth

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Actions can run at all
        run: echo "✓ Actions are enabled and this runner started. Policy is not the problem."

      - name: HARNESS_DEPLOY_TOKEN is present
        env:
          DEPLOY_TOKEN: ${{ secrets.HARNESS_DEPLOY_TOKEN }}
        run: |
          if [ -z "${DEPLOY_TOKEN:-}" ]; then
            echo "✗ HARNESS_DEPLOY_TOKEN is EMPTY."
            echo ""
            echo "  Repo secrets travel with a repo through an org transfer; ORG-level secrets"
            echo "  do not. If this secret lived on the enhans-jooyeon org, it is gone and must"
            echo "  be re-added as a REPO secret here:"
            echo "    Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "✓ secret is set (${#DEPLOY_TOKEN} characters)"

      - name: Token can READ the harness repo
        env:
          DEPLOY_TOKEN: ${{ secrets.HARNESS_DEPLOY_TOKEN }}
        run: |
          set -uo pipefail
          for OWNER in viralpick enhans-jooyeon; do
            URL="https://x-access-token:${DEPLOY_TOKEN}@github.com/${OWNER}/synapse-harness.git"
            if git ls-remote "$URL" >/dev/null 2>&1; then
              echo "✓ read OK via ${OWNER}/synapse-harness"
            else
              echo "✗ read FAILED via ${OWNER}/synapse-harness"
            fi
          done
          echo ""
          echo "A fine-grained PAT is scoped to a resource OWNER and does not follow an org"
          echo "transfer. If viralpick fails, reissue the token under the viralpick org with"
          echo "Contents: Read and write on synapse-harness."

      - name: Token can WRITE to the harness repo (dry run — pushes nothing)
        env:
          DEPLOY_TOKEN: ${{ secrets.HARNESS_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${DEPLOY_TOKEN}@github.com/viralpick/synapse-harness.git" probe
          cd probe
          git config user.name "synapse-bot"
          git config user.email "synapse-bot@users.noreply.github.com"
          git commit --allow-empty -m "auth probe (not pushed)" --quiet
          # --dry-run performs the full auth + ref negotiation and writes nothing.
          git push --dry-run origin HEAD:refs/heads/main
          echo ""
          echo "✓ WRITE ACCESS CONFIRMED. publish-harness.yml will succeed on the next tag."
