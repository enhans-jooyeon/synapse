# Diagnose the harness publish path WITHOUT cutting a release.
#
# publish-harness.yml fires only on a `v*.*.*` tag, and a tag is immutable — so a bad
# token or a disabled-Actions policy costs a whole version number to discover. This runs
# the same handshake, publishes NOTHING, and can be re-run freely.
#
# Run it: Actions → "Check harness auth" → Run workflow.
# If it is not listed in the Actions tab at all, Actions are disabled for this repo or
# blocked by the organization's Actions policy — that absence is itself the diagnosis.
#
# DESIGN RULE: no step may exit on a raw git error. Git fails with exit 128 for every
# auth problem and prints nothing useful, so every git call here captures its output,
# classifies it, and prints the remedy. The job fails at the END, after the report.
name: Check harness auth

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GIT_TERMINAL_PROMPT: '0'      # never hang waiting for a username/password prompt
    steps:
      - name: 1 · Actions can run at all
        run: echo "PASS — runner started, so the org/repo Actions policy is not the problem."

      - name: 2a · Deploy key (the route a repo admin can self-serve)
        shell: bash {0}
        env:
          DEPLOY_KEY: ${{ secrets.HARNESS_DEPLOY_KEY }}
        run: |
          set +e
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "NOT CONFIGURED — no HARNESS_DEPLOY_KEY secret on this repo."
            echo "DK=absent" >> "$GITHUB_ENV"
            echo ""
            echo "  If you believe you added it, the secret NAME is the usual culprit — it must"
            echo "  be exactly HARNESS_DEPLOY_KEY, on this repository (not the harness repo,"
            echo "  and not an organization secret)."
            echo ""
            echo "  A deploy key is the route that needs only REPO ADMIN on the target repo."
            echo "  A fine-grained PAT against an org-owned repo can require an org OWNER's"
            echo "  approval, which a plain member cannot grant. See publish-harness.yml."
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/harness_key
          chmod 600 ~/.ssh/harness_key
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/harness_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          OUT="$(git ls-remote git@github.com:viralpick/synapse-harness.git 2>&1)"; RC=$?
          if [ $RC -ne 0 ]; then
            echo "DK=broken" >> "$GITHUB_ENV"
            echo "READ FAILED (exit ${RC}): ${OUT}"
            echo "  The public half is probably not on viralpick/synapse-harness, or the"
            echo "  private half was pasted without its BEGIN/END lines."
            exit 1
          fi
          echo "READ OK via deploy key."
          git clone --depth 1 git@github.com:viralpick/synapse-harness.git dk >/dev/null 2>&1
          cd dk
          git config user.name synapse-bot; git config user.email synapse-bot@users.noreply.github.com
          git commit --allow-empty -m probe --quiet
          OUT="$(git push --dry-run origin HEAD:refs/heads/main 2>&1)"; RC=$?
          if [ $RC -eq 0 ]; then
            echo "DK=ok" >> "$GITHUB_ENV"
            echo "WRITE OK — the deploy key can publish. publish-harness.yml will use it."
            echo ""
            echo "  This is the path publish-harness.yml prefers, so the PAT checks that follow"
            echo "  are INFORMATIONAL ONLY and cannot fail this job."
          else
            echo "DK=readonly" >> "$GITHUB_ENV"
            echo "WRITE FAILED (exit ${RC}): ${OUT}"
            echo "  The key is installed but READ-ONLY. On the target repo: Settings ->"
            echo "  Deploy keys -> remove it and re-add with 'Allow write access' TICKED."
            echo "  (That checkbox cannot be changed after the key is added.)"
            exit 1
          fi

      - name: 2b · PAT is present (fallback route)
        shell: bash {0}
        env:
          DEPLOY_TOKEN: ${{ secrets.HARNESS_DEPLOY_TOKEN }}
        run: |
          set +e
          if [ "${DK:-}" = "ok" ]; then
            echo "SKIPPED — the deploy key already works; the PAT is not used."
            exit 0
          fi
          if [ -z "${DEPLOY_TOKEN:-}" ]; then
            echo "FAIL — HARNESS_DEPLOY_TOKEN is EMPTY or does not exist on this repo."
            echo ""
            echo "  Repo secrets travel with a repo through an org transfer. ORG-level secrets"
            echo "  do NOT. If this secret lived on the enhans-jooyeon org, it is gone."
            echo ""
            echo "  Fix: Settings -> Secrets and variables -> Actions -> New REPOSITORY secret"
            echo "       name: HARNESS_DEPLOY_TOKEN"
            exit 1
          fi
          echo "PASS — secret is set (${#DEPLOY_TOKEN} characters)."
          case "$DEPLOY_TOKEN" in
            github_pat_*) echo "       Looks like a FINE-GRAINED PAT. These are bound to a resource owner"
                          echo "       and do NOT follow a repo across an org transfer. If step 3 fails," 
                          echo "       reissue it with Resource owner = viralpick." ;;
            ghp_*)        echo "       Looks like a CLASSIC PAT. These are scoped by permission, not owner," 
                          echo "       so an org move does not invalidate them — but the account behind it" 
                          echo "       still needs write access to viralpick/synapse-harness." ;;
            ghs_*|gho_*)  echo "       Looks like an app/OAuth token, not a PAT. Probably not what you want." ;;
            *)            echo "       Unrecognised token prefix — check you pasted the whole value." ;;
          esac

      - name: 3 · Diagnose read + write access
        # `shell: bash {0}` REPLACES the default `bash -e {0}`. This matters more than it
        # looks: with errexit on, the first failing git command kills the step at 128 before
        # any diagnostic prints — which is precisely the opacity this workflow exists to
        # remove, and it swallowed two runs before being spotted. `set +e` repeats it
        # explicitly so a future edit to the `shell:` line cannot silently reintroduce it.
        shell: bash {0}
        env:
          DEPLOY_TOKEN: ${{ secrets.HARNESS_DEPLOY_TOKEN }}
        run: |
          set +e
          set -uo pipefail
          FAILED=0

          # Once the deploy key is proven, publish-harness.yml never touches the PAT — so a
          # PAT failure must not fail this job. The first version of this workflow did fail
          # it, reporting BROKEN while the configured route was healthy. Run the checks for
          # information, then exit on the deploy key's verdict.
          if [ "${DK:-}" = "ok" ]; then
            echo "NOTE: the deploy key passed. Everything below is INFORMATIONAL about the"
            echo "      unused PAT fallback and cannot fail this job."
            INFORMATIONAL=1
          else
            INFORMATIONAL=0
          fi

          probe () {  # $1 = owner
            local OWNER="$1"
            local URL="https://x-access-token:${DEPLOY_TOKEN}@github.com/${OWNER}/synapse-harness.git"
            local OUT RC
            OUT="$(git ls-remote "$URL" 2>&1)"; RC=$?
            # Never let the token itself reach the log, whatever git echoed back.
            OUT="${OUT//${DEPLOY_TOKEN}/***}"
            if [ $RC -eq 0 ]; then
              echo "  READ  ${OWNER}/synapse-harness — OK"
              return 0
            fi
            echo "  READ  ${OWNER}/synapse-harness — FAILED (git exit ${RC})"
            echo "        git said: ${OUT}"
            case "$OUT" in
              *"could not read Username"*|*"Authentication failed"*|*"Invalid username or password"*)
                echo "        MEANING: the token was rejected. It is expired, revoked, or malformed." ;;
              *"not found"*|*"Repository not found"*)
                echo "        MEANING: authenticated, but this token cannot SEE that repo. For a"
                echo "                 fine-grained PAT this is the classic symptom of the wrong"
                echo "                 Resource owner, or of the repo not being in its selected list." ;;
              *"403"*|*"Forbidden"*)
                echo "        MEANING: the org blocks this token. Check viralpick -> Settings ->"
                echo "                 Personal access tokens, which can require org approval." ;;
              *) echo "        MEANING: unclassified — paste the line above and I will read it." ;;
            esac
            return 1
          }

          echo "── Read probe ──────────────────────────────────────────────"
          probe viralpick        || FAILED=1
          probe enhans-jooyeon   || true   # informational only; the old path is not required

          echo ""
          echo "── Write probe (dry run — pushes nothing) ──────────────────"
          if [ "$FAILED" -ne 0 ]; then
            echo "  SKIPPED — read access failed first; fix that before testing write."
          else
            run_git () {   # $1 = human label; rest = the command
              local LABEL="$1"; shift
              local OUT RC
              OUT="$("$@" 2>&1)"; RC=$?
              OUT="${OUT//${DEPLOY_TOKEN}/***}"
              if [ $RC -eq 0 ]; then
                echo "  ${LABEL} — OK"
                return 0
              fi
              echo "  ${LABEL} — FAILED (git exit ${RC})"
              echo "        git said: ${OUT}"
              return 1
            }

            URL="https://x-access-token:${DEPLOY_TOKEN}@github.com/viralpick/synapse-harness.git"
            if run_git "clone" git clone --depth 1 "$URL" probe; then
              cd probe
              git config user.name  "synapse-bot"
              git config user.email "synapse-bot@users.noreply.github.com"
              git commit --allow-empty -m "auth probe (never pushed)" --quiet
              if run_git "push --dry-run" git push --dry-run origin HEAD:refs/heads/main; then
                echo ""
                echo "  WRITE OK — publish-harness.yml will succeed on the next tag."
              else
                echo ""
                echo "        MEANING: the token READS but cannot WRITE. Read and write are"
                echo "                 separate permissions, so a working ls-remote proves"
                echo "                 nothing about push."
                echo "        FIX:     github.com/settings/personal-access-tokens -> this token"
                echo "                 -> Repository permissions -> Contents: READ AND WRITE"
                echo "                 (Read-only is the default and is not enough.)"
                echo "                 If viralpick requires approval for fine-grained PATs, an"
                echo "                 org owner must also approve it: viralpick -> Settings ->"
                echo "                 Personal access tokens -> Pending requests."
                FAILED=1
              fi
              cd ..
            else
              echo "        MEANING: ls-remote succeeded but clone did not — unusual. Paste the"
              echo "                 git message above."
              FAILED=1
            fi
          fi

          echo ""
          echo "════════════════════════════════════════════════════════════"
          if [ "$INFORMATIONAL" -eq 1 ]; then
            if [ "$FAILED" -ne 0 ]; then
              echo "RESULT: HEALTHY — publishing goes over the DEPLOY KEY, which passed."
              echo "        The PAT fallback is broken, which does not matter. Delete the"
              echo "        HARNESS_DEPLOY_TOKEN secret to stop testing a credential you"
              echo "        no longer use, or leave it as a dormant backup."
            else
              echo "RESULT: HEALTHY — both the deploy key and the PAT fallback work."
            fi
            exit 0
          fi
          if [ "$FAILED" -ne 0 ]; then
            echo "RESULT: BROKEN — no working route to the harness. Do not cut a release."
            echo "        Deploy key: ${DK:-absent}. PAT: failed."
            echo "        The deploy key is the route a repo admin can fix alone; see"
            echo "        docs/DISTRIBUTION.md step 2."
            exit 1
          fi
          echo "RESULT: HEALTHY — publishing goes over the PAT fallback (no deploy key set)."
